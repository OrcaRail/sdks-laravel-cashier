name: Laravel Cashier SDK

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PHP 8.1 is excluded: it forces Laravel 10 (EOL), whose releases are
        # all blocked by Composer's security-advisory policy.
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Resolve the newest Laravel/testbench compatible with each PHP version
      # instead of the lock file, which is pinned to one Laravel major.
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
        with:
          dependency-versions: highest
      - run: composer test
      - run: composer analyse
      - run: composer cs-check
